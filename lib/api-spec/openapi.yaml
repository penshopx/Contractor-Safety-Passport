openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Dashboard and readiness summaries
  - name: projects
    description: Construction project management
  - name: people
    description: K3 personnel and roles
  - name: documents
    description: SMKK and CSMS document tracking
  - name: document-generator
    description: Generate project-specific RKK and CSMS documents
  - name: certificates
    description: Certificate and expiry tracking
  - name: field-activities
    description: Daily safety activities
  - name: monthly-reports
    description: Saved monthly SMKK reports
  - name: safety-boq
    description: Shared project safety BOQ drafts
  - name: safety-price-catalog
    description: Organization safety price reference catalog
  - name: storage
    description: Protected evidence file storage
  - name: organizations
    description: Contractor workspace onboarding and access context
  - name: classifications
    description: Versioned construction classifications and capability fit
paths:
  /storage/uploads/request-url:
    post:
      operationId: requestEvidenceUploadUrl
      tags: [storage]
      summary: Request a protected direct-upload URL for field evidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceUploadRequest"
      responses:
        "200":
          description: Upload destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceUploadTarget"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /organization-context:
    get:
      operationId: getOrganizationContext
      tags: [organizations]
      summary: Get the signed-in user's active contractor workspace
      responses:
        "200":
          description: Workspace context, or null when onboarding is required
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/OrganizationContext"
                  - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /organizations:
    post:
      operationId: createOrganization
      tags: [organizations]
      summary: Create the contractor workspace for the signed-in user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInput"
      responses:
        "201":
          description: Created workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationContext"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /organization-members:
    get:
      operationId: listOrganizationMembers
      tags: [organizations]
      summary: List members and pending invitations in the active workspace
      responses:
        "200":
          description: Workspace members and invitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMembers"
        "403":
          $ref: "#/components/responses/Forbidden"
  /organization-invitations:
    post:
      operationId: inviteOrganizationMember
      tags: [organizations]
      summary: Invite a member to the active workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInvitationInput"
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInvitation"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /organization-invitations/{invitationId}/accept:
    post:
      operationId: acceptOrganizationInvitation
      tags: [organizations]
      summary: Accept a specific workspace invitation for the signed-in user
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Accepted workspace context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationContext"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /organization-invitations/{invitationId}:
    delete:
      operationId: revokeOrganizationInvitation
      tags: [organizations]
      summary: Revoke a pending workspace invitation
      parameters:
        - name: invitationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Invitation revoked
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /organization-members/{userId}:
    patch:
      operationId: updateOrganizationMemberRole
      tags: [organizations]
      summary: Change a workspace member role
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationMemberRoleUpdate"
      responses:
        "200":
          description: Updated member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationMember"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: removeOrganizationMember
      tags: [organizations]
      summary: Remove a non-owner member from the active workspace
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Member removed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/readiness:
    get:
      operationId: getReadinessSummary
      tags: [dashboard]
      summary: Get SMKK and CSMS readiness
      responses:
        "200":
          description: Readiness summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessSummary"
  /activity:
    get:
      operationId: listActivity
      tags: [dashboard]
      summary: List recent activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List projects
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
  /projects/{projectId}/safety-boq:
    get:
      operationId: getProjectSafetyBoq
      tags: [safety-boq]
      summary: Get the shared safety BOQ draft for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Versioned shared BOQ draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyBoqDraft"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: replaceProjectSafetyBoq
      tags: [safety-boq]
      summary: Replace the shared safety BOQ draft for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyBoqDraftInput"
      responses:
        "200":
          description: Updated versioned shared BOQ draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyBoqDraft"
        "409":
          $ref: "#/components/responses/Conflict"
        "403":
          $ref: "#/components/responses/Forbidden"
  /construction-classifications:
    get:
      operationId: listConstructionClassifications
      tags: [classifications]
      summary: List verified and pending construction classification references
      responses:
        "200":
          description: Classification reference rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConstructionClassification"
  /organization-classifications:
    get:
      operationId: listOrganizationClassifications
      tags: [classifications]
      summary: List the active organization's capability classifications
      responses:
        "200":
          description: Organization capability profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationClassification"
    post:
      operationId: addOrganizationClassification
      tags: [classifications]
      summary: Add a classification capability to the active organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationClassificationInput"
      responses:
        "201":
          description: Capability classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationClassification"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/classifications:
    get:
      operationId: listProjectClassifications
      tags: [classifications]
      summary: List a project's primary and supporting classifications
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project classifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectClassification"
    post:
      operationId: addProjectClassification
      tags: [classifications]
      summary: Add a primary or supporting project classification
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectClassificationInput"
      responses:
        "201":
          description: Project classification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectClassification"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
  /projects/{projectId}/organization-fit:
    get:
      operationId: getOrganizationProjectFit
      tags: [classifications]
      summary: Evaluate organization-project classification fit with explanation
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Explainable preliminary fit result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationProjectFit"
        "404":
          $ref: "#/components/responses/NotFound"
  /safety-price-catalog:
    get:
      operationId: listSafetyPriceCatalogItems
      tags: [safety-price-catalog]
      summary: List the active workspace safety price catalog
      responses:
        "200":
          description: Organization price catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SafetyPriceCatalogItem"
    post:
      operationId: createSafetyPriceCatalogItem
      tags: [safety-price-catalog]
      summary: Add an item to the active workspace safety price catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyPriceCatalogItemInput"
      responses:
        "201":
          description: Created catalog item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyPriceCatalogItem"
        "403":
          $ref: "#/components/responses/Forbidden"
  /safety-price-catalog/{id}:
    patch:
      operationId: updateSafetyPriceCatalogItem
      tags: [safety-price-catalog]
      summary: Update an item in the active workspace safety price catalog
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SafetyPriceCatalogItemInput"
      responses:
        "200":
          description: Updated catalog item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyPriceCatalogItem"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteSafetyPriceCatalogItem
      tags: [safety-price-catalog]
      summary: Delete an item from the active workspace safety price catalog
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "204":
          description: Catalog item deleted
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/csms-readiness:
    get:
      operationId: getProjectCsmsReadiness
      tags: [projects]
      summary: Get stage readiness for the project's active CSMS profile
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Project CSMS readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCsmsReadiness"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      operationId: updateProjectCsmsReadiness
      tags: [projects]
      summary: Set the active CSMS profile and item statuses for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCsmsReadinessUpdate"
      responses:
        "200":
          description: Updated project CSMS readiness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCsmsReadiness"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Readiness was changed by another editor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCsmsReadiness"
        "404":
          $ref: "#/components/responses/NotFound"
  /projects/{projectId}/csms-readiness/suggestions:
    post:
      operationId: suggestProjectCsmsEvidence
      tags: [projects]
      summary: Suggest read-only next steps for unreviewed project CSMS evidence
      parameters:
        - name: projectId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Suggestions grounded in the current CSMS profile and saved evidence statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsmsEvidenceSuggestions"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          description: Too many suggestion requests
        "502":
          description: AI suggestions unavailable
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Updated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          $ref: "#/components/responses/NotFound"
  /people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List K3 personnel
      responses:
        "200":
          description: Personnel
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: createPerson
      tags: [people]
      summary: Add K3 personnel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Created person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
  /people/{id}:
    patch:
      operationId: updatePerson
      tags: [people]
      summary: Update K3 personnel
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          $ref: "#/components/responses/NotFound"
  /documents:
    get:
      operationId: listDocuments
      tags: [documents]
      summary: List safety documents
      responses:
        "200":
          description: Safety documents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SafetyDocument"
    post:
      operationId: createDocument
      tags: [documents]
      summary: Add safety document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentInput"
      responses:
        "201":
          description: Created document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SafetyDocument"
  /document-templates:
    get:
      operationId: listDocumentTemplates
      tags: [document-generator]
      summary: List supported document templates
      responses:
        "200":
          description: Supported document templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentTemplate"
  /csms-profiles:
    get:
      operationId: listCsmsProfiles
      tags: [document-generator]
      summary: List issuer-specific CSMS profiles and guideline versions
      responses:
        "200":
          description: Supported CSMS profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CsmsProfile"
    post:
      operationId: createCsmsProfile
      tags: [document-generator]
      summary: Create an organization-owned CSMS guideline version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsmsProfileInput"
      responses:
        "201":
          description: Created CSMS profile version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsmsProfile"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Issuer and version already exist
  /csms-profiles/{id}:
    put:
      operationId: updateCsmsProfile
      tags: [document-generator]
      summary: Replace an unused organization-owned CSMS guideline version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsmsProfileInput"
      responses:
        "200":
          description: Updated CSMS profile version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsmsProfile"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Profile is already in use or issuer and version already exist
  /csms-profiles/{id}/archive:
    patch:
      operationId: setCsmsProfileArchived
      tags: [document-generator]
      summary: Archive or restore an organization-owned CSMS guideline version
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CsmsProfileArchiveUpdate"
      responses:
        "200":
          description: Updated CSMS profile archive status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CsmsProfile"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /generated-documents:
    post:
      operationId: generateDocument
      tags: [document-generator]
      summary: Generate an RKK or CSMS document from project data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratedDocumentInput"
      responses:
        "201":
          description: Generated document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedDocument"
        "404":
          $ref: "#/components/responses/NotFound"
  /certificates:
    get:
      operationId: listCertificates
      tags: [certificates]
      summary: List certificates
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Certificate"
    post:
      operationId: createCertificate
      tags: [certificates]
      summary: Add certificate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CertificateInput"
      responses:
        "201":
          description: Created certificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Certificate"
  /field-activities:
    get:
      operationId: listFieldActivities
      tags: [field-activities]
      summary: List field activities
      responses:
        "200":
          description: Field activities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FieldActivity"
    post:
      operationId: createFieldActivity
      tags: [field-activities]
      summary: Record a field activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldActivityInput"
      responses:
        "201":
          description: Created field activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldActivity"
  /field-activities/draft:
    post:
      operationId: draftFieldActivityNotes
      tags: [field-activities]
      summary: Suggest an editable field report draft from user-provided notes
      description: Optional online writing aid. Does not save or approve a report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldActivityDraftInput"
      responses:
        "200":
          description: Suggested text for human review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FieldActivityDraft"
        "400":
          description: Insufficient or invalid input
        "429":
          description: Too many requests
        "502":
          description: AI service unavailable
  /monthly-reports:
    get:
      operationId: listMonthlyReports
      tags: [monthly-reports]
      summary: List saved monthly SMKK reports
      responses:
        "200":
          description: Saved reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyReport"
    post:
      operationId: createMonthlyReport
      tags: [monthly-reports]
      summary: Save a monthly SMKK report draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyReportInput"
      responses:
        "201":
          description: Saved report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"
        "409":
          $ref: "#/components/responses/Conflict"
  /monthly-reports/{id}:
    get:
      operationId: getMonthlyReport
      tags: [monthly-reports]
      summary: Open a saved monthly SMKK report
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Saved report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMonthlyReport
      tags: [monthly-reports]
      summary: Continue or finalize a saved monthly SMKK report
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlyReportUpdate"
      responses:
        "200":
          description: Updated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReport"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Insufficient workspace permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ErrorResponse:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
