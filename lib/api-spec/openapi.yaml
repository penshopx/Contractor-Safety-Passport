      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    ConstructionClassification:
      type: object
      properties:
        id: { type: string }
        versionId: { type: string }
        code: { type: string, pattern: "^[A-Z]{2}[0-9]{3}$" }
        family: { type: string, enum: [BG, BS, IN, KK, KP, PA, PB, PL] }
        name: { type: string }
        nature: { type: string, enum: [UMUM, SPESIALIS] }
        allowedQualifications:
          type: array
          items: { type: string, enum: [KECIL, MENENGAH, BESAR] }
        sourceVerificationStatus: { type: string }
      required: [id, versionId, code, family, name, nature, allowedQualifications, sourceVerificationStatus]
    OrganizationClassificationInput:
      type: object
      properties:
        classificationId: { type: string, minLength: 1 }
        qualification: { type: string, enum: [KECIL, MENENGAH, BESAR] }
        evidenceStatus: { type: string, enum: [MENUNGGU_VERIFIKASI, TERVERIFIKASI, DITOLAK] }
        evidenceReference: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
      required: [classificationId]
    OrganizationClassification:
      allOf:
        - $ref: "#/components/schemas/OrganizationClassificationInput"
        - type: object
          properties:
            organizationId: { type: string }
            code: { type: string }
            name: { type: string }
            family: { type: string }
            nature: { type: string }
            versionId: { type: string }
            sourceVerificationStatus: { type: string }
          required: [organizationId, code, name, family, nature, versionId, sourceVerificationStatus]
    ProjectClassificationInput:
      type: object
      properties:
        classificationId: { type: string, minLength: 1 }
        role: { type: string, enum: [PRIMARY, SUPPORTING] }
        requiredQualification: { type: string, enum: [KECIL, MENENGAH, BESAR] }
      required: [classificationId, role]
    ProjectClassification:
      allOf:
        - $ref: "#/components/schemas/ProjectClassificationInput"
        - type: object
          properties:
            organizationId: { type: string }
            projectId: { type: integer }
            code: { type: string }
            name: { type: string }
            family: { type: string }
            versionId: { type: string }
          required: [organizationId, projectId, code, name, family, versionId]
    OrganizationProjectFit:
      type: object
      properties:
        organizationId: { type: string }
        projectId: { type: integer }
